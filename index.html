  <head>

    <meta property="og:title" content="Мате-Ментор: Мате-Хут!" />
    <meta property="og:description" content="Интерактивна образовна платформа за математика со Мате-Хут квизови во живо, генерирани лекции и сценарија за наставници." />
    <title>Мате-Ментор: Мате-Хут!</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- KaTeX CSS for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom print styles */
      @media print {
        @page {
          margin: 1cm;
        }
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .katex { font-size: 1.15em; }
      .katex * { box-sizing: content-box; }
      .katex .svg-align { text-align: left !important; }
      .katex .hide-tail { overflow: hidden !important; }
      .katex .sqrt { display: inline-block !important; }
      .katex .sqrt > .root { margin-left: 0.2777777778em !important; margin-right: -0.5555555556em !important; }
      .katex svg {
        display: block !important;
        position: absolute !important;
        width: 100% !important;
        height: inherit !important;
        max-width: none !important;
        max-height: none !important;
        min-width: 0 !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        fill: currentColor !important;
        stroke: currentColor !important;
        stroke-width: 1 !important;
        background: transparent !important;
        vertical-align: baseline !important;
        transform: none !important;
      }
      .katex svg path {
        stroke: none !important;
        stroke-width: 0 !important;
        fill: currentColor !important;
      }
      
      /* Flashcard Flip Animation */
      .perspective-1000 {
        perspective: 1000px;
      }
      .preserve-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
    </style>
</head>
  <body class="bg-slate-50 text-slate-900">

  </body>
